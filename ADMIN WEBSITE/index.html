<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>99infinity · Admin Panel</title>
<style>
/* ==========================================================================
   99infinity ADMIN — single file, no build step, no external libraries.
   Talks straight to the Firebase RTDB REST API (the same database the app
   uses), so every switch here changes the live platform instantly.
   ========================================================================== */
:root{
  --bg:#0b0f14; --panel:#121821; --panel-2:#161e29; --border:#1e2733;
  --text:#e6edf3; --muted:#8b949e; --green:#00d09c; --green-d:#00b489;
  --gold:#e6c27a; --red:#ff4d4d; --blue:#6ea8f4; --violet:#c86eff;
  --radius:12px; --radius-sm:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
  background:var(--bg);color:var(--text);font-size:14px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#25303d;border-radius:6px}
::-webkit-scrollbar-track{background:transparent}

/* ---------------- login ---------------- */
#gate{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 0%,#132030 0%,#0b0f14 60%);padding:20px}
#gate.hide{display:none}
.gate-box{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--border);
  border-radius:16px;padding:26px}
.gate-logo{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.gate-logo b{font-size:19px;letter-spacing:.2px}
.gate-logo span{font-size:11px;color:var(--muted);display:block}
.gate-dot{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#c5bc0c,#20d374,#0cbac5);
  display:flex;align-items:center;justify-content:center;font-weight:800;color:#06231a}
.gate-hint{font-size:12px;color:var(--muted);margin-top:14px;line-height:1.6}

/* ---------------- layout ---------------- */
#app{display:none;min-height:100vh}
#app.on{display:flex}
.side{width:236px;flex:0 0 236px;background:var(--panel);border-right:1px solid var(--border);
  padding:16px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 16px}
.brand b{font-size:15px}
.brand small{display:block;color:var(--muted);font-size:11px;max-width:150px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.nav-sec{color:var(--muted);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
  padding:14px 10px 6px;font-weight:700}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;
  background:transparent;border-radius:var(--radius-sm);cursor:pointer;text-align:left;
  font-size:13.5px;color:#c9d4e0;transition:.15s}
.nav button:hover{background:#1a2230;color:#fff}
.nav button.on{background:rgba(0,208,156,.13);color:#fff;box-shadow:inset 2px 0 0 var(--green)}
.nav .ico{width:20px;text-align:center;font-size:15px}
.nav .pill{margin-left:auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;
  border-radius:20px;padding:1px 7px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;
  padding:12px 18px;background:rgba(11,15,20,.86);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border)}
.top h1{font-size:16px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .status{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
.dot.bad{background:var(--red);box-shadow:0 0 8px var(--red)}
.view{padding:18px;display:flex;flex-direction:column;gap:16px}

/* ---------------- cards / kpi ---------------- */
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.card h2{font-size:14px;font-weight:700;margin-bottom:2px}
.card .sub{color:var(--muted);font-size:12px;margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px}
.kpi small{display:block;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em}
.kpi b{display:block;font-size:23px;font-weight:800;margin-top:6px}
.kpi span{font-size:12px;color:var(--muted)}
.kpi.green b{color:var(--green)} .kpi.gold b{color:var(--gold)}
.kpi.red b{color:var(--red)} .kpi.blue b{color:var(--blue)}

/* ---------------- table ---------------- */
.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:var(--radius)}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:640px}
th{background:var(--panel-2);text-align:left;padding:10px 12px;font-size:11.5px;color:var(--muted);
  text-transform:uppercase;letter-spacing:.06em;position:sticky;top:0;white-space:nowrap}
td{padding:10px 12px;border-top:1px solid var(--border);vertical-align:middle}
tbody tr:hover{background:#151d28}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.empty{padding:26px;text-align:center;color:var(--muted);font-size:13px}
.clickable{cursor:pointer}

/* ---------------- controls ---------------- */
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:120px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted)}
input,select,textarea{background:#0e141c;border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:9px 11px;width:100%;outline:none;transition:.15s}
input:focus,select:focus,textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(0,208,156,.12)}
textarea{resize:vertical;min-height:78px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border);background:#1a2230;
  padding:9px 13px;border-radius:var(--radius-sm);cursor:pointer;font-size:13px;font-weight:600;transition:.15s}
.btn:hover{background:#212c3c}
.btn.primary{background:var(--green);border-color:var(--green);color:#04231a}
.btn.primary:hover{background:var(--green-d)}
.btn.danger{background:rgba(255,77,77,.14);border-color:rgba(255,77,77,.35);color:#ff8a8a}
.btn.danger:hover{background:rgba(255,77,77,.22)}
.btn.gold{background:rgba(230,194,122,.14);border-color:rgba(230,194,122,.35);color:var(--gold)}
.btn.sm{padding:6px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.muted{color:var(--muted)}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700}
.badge.g{background:rgba(0,208,156,.15);color:var(--green)}
.badge.r{background:rgba(255,77,77,.15);color:#ff8a8a}
.badge.y{background:rgba(230,194,122,.15);color:var(--gold)}
.badge.b{background:rgba(110,168,244,.15);color:var(--blue)}
.badge.n{background:#1c2530;color:var(--muted)}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--border);margin-bottom:14px;overflow:auto}
.tabs button{border:0;background:transparent;padding:9px 12px;cursor:pointer;color:var(--muted);
  font-weight:600;font-size:13px;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:#fff;border-color:var(--green)}
.stat-line{display:flex;justify-content:space-between;gap:12px;padding:7px 0;
  border-bottom:1px dashed #1d2733;font-size:13px}
.stat-line:last-child{border:0}
.stat-line b{font-variant-numeric:tabular-nums}

/* ---------------- modal / toast ---------------- */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(4,7,10,.72);display:none;
  align-items:flex-start;justify-content:center;padding:26px 14px;overflow:auto}
.overlay.on{display:flex}
.sheet{width:100%;max-width:920px;background:var(--panel);border:1px solid var(--border);
  border-radius:16px;padding:20px;margin:auto}
.sheet-head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.sheet-head h2{flex:1;font-size:16px}
#toasts{position:fixed;right:16px;bottom:16px;z-index:80;display:flex;flex-direction:column;gap:8px}
.toast{background:#16202b;border:1px solid var(--border);border-left:3px solid var(--green);
  padding:11px 14px;border-radius:10px;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.4);
  animation:tin .2s ease;max-width:320px}
.toast.err{border-left-color:var(--red)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

@media (max-width:900px){
  #app.on{flex-direction:column}
  .side{width:100%;flex:none;height:auto;position:static;border-right:0;
    border-bottom:1px solid var(--border);padding:10px}
  .nav{flex-direction:row;overflow:auto;gap:6px}
  .nav button{width:auto;white-space:nowrap;padding:8px 11px}
  .nav-sec{display:none}
  .view{padding:12px}
  .top{padding:10px 12px}
}
</style>
</head>
<body>

<!-- ============================ LOGIN GATE ============================ -->
<div id="gate">
  <div class="gate-box">
    <div class="gate-logo">
      <div class="gate-dot">99</div>
      <div><b>Admin Panel</b><span>99infinity control room</span></div>
    </div>
    <div style="display:flex;flex-direction:column;gap:10px">
      <label class="f">Database URL
        <input id="gateDb" placeholder="https://your-project-default-rtdb.firebaseio.com" />
      </label>
      <label class="f">Admin password
        <input id="gatePass" type="password" placeholder="••••••" />
      </label>
    </div>
    <button class="btn primary" id="gateBtn" style="width:100%;justify-content:center;margin-top:16px">
      Open control room
    </button>
    <p class="gate-hint">
      Default password <b class="mono">admin123</b> — change it inside this file (search
      <span class="mono">ADMIN_PASSWORD</span>). Every switch here writes to the same Firebase
      database the app reads, so changes are live immediately.
    </p>
    <p class="gate-hint" id="gateErr" style="color:#ff8a8a"></p>
  </div>
</div>

<!-- ============================ APP ============================ -->
<div id="app">
  <aside class="side">
    <div class="brand">
      <div class="gate-dot">99</div>
      <div><b>Admin</b><small id="sideDb">—</small></div>
    </div>
    <div class="nav-sec">Overview</div>
    <nav class="nav" id="navTop"></nav>
    <div class="nav-sec">Money</div>
    <nav class="nav" id="navMoney"></nav>
    <div class="nav-sec">Platform</div>
    <nav class="nav" id="navPlatform"></nav>
  </aside>

  <div class="main">
    <header class="top">
      <h1 id="pageTitle">Dashboard</h1>
      <span class="status"><span class="dot" id="dbDot"></span><span id="dbState">connected</span></span>
      <button class="btn sm" id="reloadBtn">↻ Refresh</button>
      <button class="btn sm danger" id="logoutBtn">Log out</button>
    </header>
    <div class="view" id="view"></div>
  </div>
</div>

<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>
<div id="toasts"></div>

<script>
/* ==========================================================================
   99infinity ADMIN PANEL
   1) CONFIG + DB LAYER  2) HELPERS  3) ROUTER  4) DASHBOARD  5) USERS
   6) DEPOSITS/WITHDRAWALS  7) TRANSACTIONS  8) NOTIFICATIONS
   9) PLATFORM CONFIG  10) TOOLS  11) BOOT
   ========================================================================== */

/* ---------------------------------------------------------------- 1. config */
/* change this password before putting the panel online */
const ADMIN_PASSWORD = 'admin123';
const DEFAULT_DB = 'https://infinity-40e33-default-rtdb.firebaseio.com';
const RESET_HOUR = 4;                        /* the platform resets 04:00 IST */
const IST_OFFSET_MS = 5.5 * 60 * 60 * 1000;

const LS = {
  get: (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch { return d; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
  del: (k) => { try { localStorage.removeItem(k); } catch {} },
};
let DB_URL = LS.get('vgAdminDb', DEFAULT_DB);

/* The Worker that serves the app itself. The merchant API key is a Worker
   secret, so it can never be read out of the database (the RTDB is public) —
   the panel asks the app's own /api/config/rewards instead, see appPayments().
   Move hosts? set localStorage.vgAdminApp once. */
const DEFAULT_APP_URL = 'https://www.99infinity.workers.dev';
const APP_URL = String(LS.get('vgAdminApp', DEFAULT_APP_URL) || DEFAULT_APP_URL)
  .replace(/\/+$/, '');

/* ------------------------------------------------------------- db layer ---- */
async function dbFetch(path, method = 'GET', body) {
  const url = DB_URL.replace(/\/+$/, '') + '/' + String(path).replace(/^\/+/, '') + '.json';
  const res = await fetch(url, {
    method,
    headers: body === undefined ? undefined : { 'content-type': 'application/json' },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  if (!res.ok) throw new Error('DB ' + res.status + ' on ' + path);
  const text = await res.text();
  if (!text || text === 'null') return null;
  try { return JSON.parse(text); } catch { return text; }
}
const dbGet = (path) => dbFetch(path, 'GET');
const dbPut = (path, value) => dbFetch(path, 'PUT', value);
const dbDelete = (path) => dbFetch(path, 'DELETE');
/** PATCH with { 'USERS/uid/balance/main': 100 } paths — one atomic write */
const dbPatch = (paths) => dbFetch('', 'PATCH', paths);
const inc = (n) => ({ '.sv': { increment: n } });

/** Live gateway flags straight from the app — { enabled, configured, autoCredit }
 *  or null when the Worker is not reachable from this browser. `configured` is
 *  the one that matters: it is true only once FAMGATEWAY_API_KEY is set on the
 *  Worker, which is exactly what makes the QR flow work on a phone. */
async function appPayments() {
  try {
    const res = await fetch(APP_URL + '/api/config/rewards', { cache: 'no-store' });
    if (!res.ok) return null;
    const data = await res.json();
    return data && data.payments ? data.payments : null;
  } catch {
    return null;
  }
}

/* ------------------------------------------------------------- 2. helpers -- */
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
const esc = (s) => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

/** ₹1,23,456.78 */
function inr(n) {
  return '₹' + Number(n || 0).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
const num = (n) => Number(n || 0).toLocaleString('en-IN');

/** ms → "28/09/2026 15:23" in IST */
function fmtTime(ms) {
  const n = Number(ms) || 0;
  if (!n) return '—';
  try {
    return new Date(n).toLocaleString('en-IN', {
      year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'Asia/Kolkata',
    });
  } catch { return new Date(n).toISOString().slice(0, 16).replace('T', ' '); }
}
function fmtDay(ms) {
  const n = Number(ms) || 0;
  if (!n) return '—';
  try {
    return new Date(n).toLocaleDateString('en-IN', {
      year: 'numeric', month: '2-digit', day: '2-digit', timeZone: 'Asia/Kolkata',
    });
  } catch { return '—'; }
}
function ago(ms) {
  const n = Number(ms) || 0;
  if (!n) return '—';
  const s = Math.max(0, (Date.now() - n) / 1000);
  if (s < 60) return Math.round(s) + 's ago';
  if (s < 3600) return Math.round(s / 60) + 'm ago';
  if (s < 86400) return Math.round(s / 3600) + 'h ago';
  return Math.round(s / 86400) + 'd ago';
}

/** the reward day the platform is on right now (cuts over at 04:00 AM IST) */
function dayKey(at = Date.now()) {
  return Math.floor((at + IST_OFFSET_MS - RESET_HOUR * 3600000) / 86400000);
}

function toast(msg, bad) {
  const el = document.createElement('div');
  el.className = 'toast' + (bad ? ' err' : '');
  el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), 3200);
}

/** the exact hash format the app verifies, so "reset password" really works */
async function hashPassword(password) {
  const iterations = 120000;
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits(
    { name: 'PBKDF2', hash: 'SHA-256', salt, iterations }, key, 256,
  );
  const hex = (buf) => Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, '0')).join('');
  return 'pbkdf2$' + iterations + '$' + hex(salt.buffer) + '$' + hex(bits);
}

function openSheet(title, html) {
  $('#sheet').innerHTML =
    '<div class="sheet-head"><h2>' + esc(title) + '</h2>' +
    '<button class="btn sm" data-close>Close</button></div>' + html;
  $('#overlay').classList.add('on');
  $('#overlay').onclick = (e) => { if (e.target.id === 'overlay') closeSheet(); };
  const btn = $('[data-close]', $('#sheet'));
  if (btn) btn.onclick = closeSheet;
  return $('#sheet');
}
const closeSheet = () => $('#overlay').classList.remove('on');
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheet(); });

/* shared in-memory cache so a view switch does not re-download everything */
const cache = { users: null, usersAt: 0, games: null };
const USERS_TTL = 20000;
async function loadUsers(force) {
  if (!force && cache.users && Date.now() - cache.usersAt < USERS_TTL) return cache.users;
  const data = (await dbGet('USERS')) || {};
  delete data._info;
  cache.users = data;
  cache.usersAt = Date.now();
  return data;
}
const userList = (users) => Object.entries(users || {}).map(([uid, u]) => ({ uid, ...(u || {}) }));
const userOf = (users, uid) => (users[uid] || {});

/* ------------------------------------------------------------- 3. router --- */
const VIEWS = [
  { group: 'navTop', key: 'dashboard', label: 'Dashboard', icon: '📊' },
  { group: 'navTop', key: 'users', label: 'Users', icon: '👥' },
  { group: 'navMoney', key: 'deposits', label: 'Deposit requests', icon: '⬇️', badge: 'deposits' },
  { group: 'navMoney', key: 'withdrawals', label: 'Withdraw requests', icon: '⬆️', badge: 'withdrawals' },
  { group: 'navMoney', key: 'payments', label: 'UPI payments', icon: '⚡' },
  { group: 'navMoney', key: 'transactions', label: 'Transactions', icon: '🧾' },
  { group: 'navPlatform', key: 'notifications', label: 'Notifications', icon: '🔔' },
  { group: 'navPlatform', key: 'wheel', label: 'Lucky Wheel', icon: '🎡' },
  { group: 'navPlatform', key: 'daily', label: 'Daily Reward', icon: '📅' },
  { group: 'navPlatform', key: 'limits', label: 'Money limits', icon: '⚖️' },
  { group: 'navPlatform', key: 'games', label: 'Games', icon: '🎮' },
  { group: 'navPlatform', key: 'tools', label: 'Tools & backup', icon: '🛠️' },
];
const TITLES = Object.fromEntries(VIEWS.map((v) => [v.key, v.label]));
let current = 'dashboard';
const badges = { deposits: 0, withdrawals: 0 };

function buildNav() {
  ['navTop', 'navMoney', 'navPlatform'].forEach((g) => ($('#' + g).innerHTML = ''));
  VIEWS.forEach((v) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = v.key === current ? 'on' : '';
    b.innerHTML = '<span class="ico">' + v.icon + '</span><span>' + v.label + '</span>' +
      (v.badge && badges[v.badge] ? '<span class="pill">' + badges[v.badge] + '</span>' : '');
    b.onclick = () => go(v.key);
    $('#' + v.group).appendChild(b);
  });
}

/** pending request counters shown next to the nav items */
async function refreshBadges() {
  try {
    const [dep, wd] = await Promise.all([dbGet('depositRequests'), dbGet('withdrawRequests')]);
    const pending = (node) => {
      let n = 0;
      Object.values(node || {}).forEach((perUser) =>
        Object.values(perUser || {}).forEach((tx) => {
          const s = String((tx || {}).status || 'pending').toLowerCase();
          if (s === 'pending') n++;
        }));
      return n;
    };
    badges.deposits = pending(dep);
    badges.withdrawals = pending(wd);
    buildNav();
  } catch { /* offline — badges just stay empty */ }
}

async function go(key, opts = {}) {
  current = key;
  buildNav();
  $('#pageTitle').textContent = TITLES[key] || key;
  const view = $('#view');
  view.innerHTML = '<div class="card"><div class="empty">Loading…</div></div>';
  try {
    if (key === 'dashboard') await viewDashboard(view, opts);
    else if (key === 'users') await viewUsers(view, opts);
    else if (key === 'deposits') await viewRequests(view, 'deposit');
    else if (key === 'withdrawals') await viewRequests(view, 'withdraw');
    else if (key === 'transactions') await viewTransactions(view, opts);
    else if (key === 'payments') await viewPayments(view);
    else if (key === 'notifications') await viewNotifications(view);
    else if (key === 'wheel') await viewWheel(view);
    else if (key === 'daily') await viewDaily(view);
    else if (key === 'limits') await viewLimits(view);
    else if (key === 'games') await viewGames(view);
    else if (key === 'tools') await viewTools(view);
  } catch (err) {
    view.innerHTML = '<div class="card"><div class="empty">⚠️ ' + esc(err.message) + '</div></div>';
  }
  refreshBadges();
}

/* shared little renderers */
const kpi = (label, value, sub, tone) =>
  '<div class="kpi ' + (tone || '') + '"><small>' + esc(label) + '</small><b>' + esc(value) +
  '</b><span>' + esc(sub) + '</span></div>';

function statusBadge(status) {
  const s = String(status || 'pending').toLowerCase();
  if (['completed', 'success', 'approved', 'paid', 'won'].includes(s))
    return '<span class="badge g">' + esc(s) + '</span>';
  if (['rejected', 'failed', 'cancelled'].includes(s))
    return '<span class="badge r">' + esc(s) + '</span>';
  if (s === 'pending') return '<span class="badge y">pending</span>';
  return '<span class="badge n">' + esc(s) + '</span>';
}

function statusPill(u) {
  const code = u.status?.code || 'active';
  if (code === 'active') return '<span class="badge g">active</span>';
  if (code === 'suspended') return '<span class="badge r">suspended</span>';
  return '<span class="badge y">' + esc(code) + '</span>';
}

/** balance of one account split the same way the app does it */
function split(u) {
  const b = u.balance || {};
  const rawTotal = Math.max(0, Number(b.total || 0));
  const promo = Math.max(0, Number(b.promo || 0));
  const main = Math.max(0, rawTotal - promo);
  return { total: main + promo, main, promo };
}

/* ------------------------------------------------------- user tab wiring --- */
function refreshUser() { return openUser(sheetUid, sheetTab); }

/** one transaction row, exactly the shape the app writes */
async function addTx(uid, type, amount, label, status = 'completed') {
  const id = 'ADM' + Date.now().toString(36).toUpperCase() +
    Math.random().toString(36).slice(2, 6).toUpperCase();
  await dbPatch({
    ['USERS/' + uid + '/transactions/' + id]: {
      type, amount, label, status, time: Date.now(), uid,
    },
  });
  return id;
}

/** moves money between the wallets and keeps total = main + promo */
async function moveMoney(uid, u, bucket, delta, note) {
  const s = split(u);
  let main = s.main, promo = s.promo;
  if (bucket === 'main') main = Math.max(0, main + delta);
  else promo = Math.max(0, promo + delta);
  const total = main + promo;
  await dbPatch({
    ['USERS/' + uid + '/balance/total']: total,
    ['USERS/' + uid + '/balance/main']: main,
    ['USERS/' + uid + '/balance/promo']: promo,
  });
  await addTx(uid, delta >= 0 ? 'bonus' : 'admin', Math.abs(delta),
    (delta >= 0 ? 'Admin credit · ' : 'Admin debit · ') + (note || 'adjustment'));
  cache.usersAt = 0;
  toast((delta >= 0 ? 'Added ' : 'Removed ') + inr(Math.abs(delta)) + ' · ' + bucket);
}

function wireUserTab() {
  const uid = sheetUid;
  const u = sheetUser || {};
  const on = (sel, fn) => { const el = $(sel); if (el) el.onclick = fn; };

  /* ---- profile ---- */
  on('#upSave', async () => {
    const name = ($('#upName')?.value || '').trim();
    const email = ($('#upEmail')?.value || '').trim();
    const phone = ($('#upPhone')?.value || '').replace(/\D/g, '');
    const vip = Number($('#upVip')?.value || 0);
    const lang = ($('#upLang')?.value || 'en').trim();
    const invite = ($('#upInvite')?.value || '').trim();
    if (name.length < 2) return toast('Username must be at least 2 characters', true);
    if (phone.length !== 10) return toast('Phone must be 10 digits', true);
    const old = String(u.auth?.phone || '');
    try {
      if (phone !== old) {
        const taken = await dbGet('PHONE_INDEX/' + phone);
        if (taken && taken !== uid) return toast('That phone already belongs to ' + taken, true);
        await dbPut('PHONE_INDEX/' + phone, uid);
        if (old) await dbDelete('PHONE_INDEX/' + old);
        await dbPatch({ ['USERS/' + uid + '/auth/phone']: phone });
      }
      await dbPatch({
        ['USERS/' + uid + '/profile/name']: name,
        ['USERS/' + uid + '/profile/email']: email,
        ['USERS/' + uid + '/profile/vip']: vip,
        ['USERS/' + uid + '/profile/language']: lang,
        ['USERS/' + uid + '/profile/invite']: invite,
      });
      cache.usersAt = 0;
      toast('Profile saved');
      refreshUser();
    } catch (e) { toast(e.message, true); }
  });

  /* ---- balance ---- */
  const amountVal = () => Math.floor(Number($('#ubAmount')?.value || 0));
  const noteVal = () => ($('#ubNote')?.value || 'Admin adjustment').trim();
  const bucketVal = () => $('#ubBucket')?.value || 'main';
  on('#ubAdd', async () => {
    const a = amountVal();
    if (a <= 0) return toast('Enter an amount first', true);
    await moveMoney(uid, u, bucketVal(), a, noteVal());
    refreshUser();
  });
  on('#ubSub', async () => {
    const a = amountVal();
    if (a <= 0) return toast('Enter an amount first', true);
    await moveMoney(uid, u, bucketVal(), -a, noteVal());
    refreshUser();
  });
  on('#ubSet', async () => {
    const main = Math.max(0, Math.floor(Number($('#usMain')?.value || 0)));
    const promo = Math.max(0, Math.floor(Number($('#usPromo')?.value || 0)));
    await dbPatch({
      ['USERS/' + uid + '/balance/total']: main + promo,
      ['USERS/' + uid + '/balance/main']: main,
      ['USERS/' + uid + '/balance/promo']: promo,
    });
    await addTx(uid, 'admin', main + promo, 'Admin set exact balance');
    cache.usersAt = 0;
    toast('Balance overwritten');
    refreshUser();
  });

  /* ---- status ---- */
  const setStatus = async (code, message) => {
    await dbPatch({
      ['USERS/' + uid + '/status/code']: code,
      ['USERS/' + uid + '/status/message']: message || '',
    });
    cache.usersAt = 0;
    toast('Status updated: ' + code);
    refreshUser();
  };
  on('#usSave', () => setStatus($('#usCode')?.value || 'active', $('#usMsg')?.value || ''));
  on('#usClear', () => setStatus('active', ''));

  /* ---- devices ---- */
  on('#ukillAll', async () => {
    if (!confirm('Log this user out of every device?')) return;
    await dbDelete('USERS/' + uid + '/devices');
    toast('All sessions removed');
    refreshUser();
  });

  /* ---- rewards ---- */
  on('#urSave', async () => {
    await dbPatch({
      ['USERS/' + uid + '/rewards/daily/streak']: Math.max(0, Number($('#urStreak')?.value || 0)),
      ['USERS/' + uid + '/rewards/daily/lastClaimDayKey']: Number($('#urClaimDay')?.value || 0),
      ['USERS/' + uid + '/rewards/freeGames']: Math.max(0, Number($('#urFree')?.value || 0)),
      ['USERS/' + uid + '/rewards/spin/totalWon']: Math.max(0, Number($('#urWon')?.value || 0)),
    });
    cache.usersAt = 0;
    toast('Rewards saved');
    refreshUser();
  });
  on('#urResetDaily', async () => {
    await dbDelete('USERS/' + uid + '/rewards/daily/lastClaimDayKey');
    toast('Daily claim unlocked again for today');
    refreshUser();
  });
  on('#urResetSpin', async () => {
    await dbDelete('SPIN/' + dayKey() + '/users/' + uid);
    toast('Spin unlocked again for today');
  });

  /* ---- danger ---- */
  on('#udPassBtn', async () => {
    const pass = $('#udPass')?.value || '';
    if (pass.length < 6) return toast('Password must be at least 6 characters', true);
    const hash = await hashPassword(pass);
    await dbPatch({ ['USERS/' + uid + '/auth/password']: hash });
    toast('Password reset — the user can log in with the new one');
  });
  on('#udLogout', async () => {
    if (!confirm('Log the user out of every device?')) return;
    await dbDelete('USERS/' + uid + '/devices');
    toast('All sessions removed');
    refreshUser();
  });
  on('#udClearTx', async () => {
    if (!confirm('Delete the whole transaction log of this user?')) return;
    await dbDelete('USERS/' + uid + '/transactions');
    cache.usersAt = 0;
    toast('Transaction log cleared');
    refreshUser();
  });
  on('#udDelete', async () => {
    const phone = String(u.auth?.phone || '');
    if (!confirm('DELETE user ' + uid + ' forever? This cannot be undone.')) return;
    await dbDelete('USERS/' + uid);
    await dbDelete('UID_INDEX/' + uid);
    if (phone) await dbDelete('PHONE_INDEX/' + phone);
    cache.usersAt = 0;
    closeSheet();
    toast('Account deleted');
    go(current, { force: true });
  });
}

/* kept global — the tables call them from inline onclick */
async function killDevice(sid) {
  if (!confirm('Log out this device?')) return;
  await dbDelete('USERS/' + sheetUid + '/devices/' + sid);
  toast('Device logged out');
  refreshUser();
}
async function setTxStatus(txId, status) {
  await dbPatch({ ['USERS/' + sheetUid + '/transactions/' + txId + '/status']: status });
  toast('Status set to ' + status);
}
async function delTx(txId) {
  if (!confirm('Delete this transaction row?')) return;
  await dbDelete('USERS/' + sheetUid + '/transactions/' + txId);
  toast('Transaction deleted');
  refreshUser();
}


/* --------------------------------------------------------------- 5. users -- */
const userState = { q: '', page: 1, per: 25, sort: 'recent', status: '' };

async function viewUsers(view, opts = {}) {
  const users = await loadUsers(!!opts.force);
  let all = userList(users);

  if (userState.status) all = all.filter((u) => (u.status?.code || 'active') === userState.status);
  const q = userState.q.trim().toLowerCase();
  if (q) {
    all = all.filter((u) =>
      String(u.uid).includes(q) ||
      String(u.auth?.phone || '').includes(q) ||
      String(u.profile?.name || '').toLowerCase().includes(q) ||
      String(u.profile?.email || '').toLowerCase().includes(q));
  }
  const sorters = {
    recent: (a, b) => Number(b.profile?.lastLogin || 0) - Number(a.profile?.lastLogin || 0),
    balance: (a, b) => split(b).total - split(a).total,
    created: (a, b) => Number(b.profile?.createdAt || 0) - Number(a.profile?.createdAt || 0),
    uid: (a, b) => String(a.uid).localeCompare(String(b.uid)),
  };
  all.sort(sorters[userState.sort] || sorters.recent);

  const pages = Math.max(1, Math.ceil(all.length / userState.per));
  userState.page = Math.min(Math.max(1, userState.page), pages);
  const from = (userState.page - 1) * userState.per;
  const rows = all.slice(from, from + userState.per);

  view.innerHTML =
    '<div class="card"><div class="row">' +
      '<div class="grow"><input id="uq" placeholder="Search by UID, phone, username or email…" value="' +
        esc(userState.q) + '" /></div>' +
      '<select id="usort" style="max-width:180px">' +
        '<option value="recent">Newest activity</option>' +
        '<option value="balance">Highest balance</option>' +
        '<option value="created">Newest accounts</option>' +
        '<option value="uid">UID</option>' +
      '</select>' +
      '<select id="ustatus" style="max-width:170px">' +

/* --------------------------------------- 6. deposit / withdraw requests --- */
/** approve a deposit: credit the MAIN wallet, mark the request completed */
async function approveDeposit(uid, txId, amount) {
  const u = (await dbGet('USERS/' + uid)) || {};
  const s = split(u);
  const amt = Number(amount || 0);
  const main = s.main + amt;
  await dbPatch({
    ['USERS/' + uid + '/balance/main']: main,
    ['USERS/' + uid + '/balance/total']: main + s.promo,
    ['USERS/' + uid + '/transactions/' + txId + '/status']: 'completed',
    ['USERS/' + uid + '/transactions/' + txId + '/completedAt']: Date.now(),
    ['USERS/' + uid + '/stats/totalDeposit']: inc(amt),
    ['depositRequests/' + uid + '/' + txId + '/status']: 'completed',
    ['depositRequests/' + uid + '/' + txId + '/approvedAt']: Date.now(),
  });
  /* the pending counter the app keeps for deposits */
  const pending = Number(u.pending?.depositCount || 0);
  if (pending > 0)
    await dbPatch({ ['USERS/' + uid + '/pending/depositCount']: Math.max(0, pending - 1) });
  cache.usersAt = 0;
  toast('Deposit approved · ' + inr(amt) + ' added to the main wallet');
}

async function rejectDeposit(uid, txId) {
  await dbPatch({
    ['depositRequests/' + uid + '/' + txId + '/status']: 'rejected',
    ['USERS/' + uid + '/transactions/' + txId + '/status']: 'rejected',
  });
  toast('Deposit rejected');
}

/** Where a withdrawal's money already sits.
 *
 *  A request made by the current app HOLDS the amount in `tx.held` (the wallet
 *  was debited the moment the request was created, see src/api.ts). A request
 *  that predates this carries no `held`, and its money is still in the wallet —
 *  that one has to be taken out at approval time. */
function heldOf(tx) {
  const h = tx && tx.held;
  if (h && typeof h === 'object') {
    const main = Math.max(0, Number(h.main || 0));
    const promo = Math.max(0, Number(h.promo || 0));
    return { main, promo, total: main + promo };
  }
  return { main: 0, promo: 0, total: 0 };
}

/** approve a withdrawal: the money is already out of the wallet, so this only
 *  confirms the payout (an older request is debited here, once) */
async function approveWithdraw(uid, txId, amount) {
  const u = (await dbGet('USERS/' + uid)) || {};
  const s = split(u);
  const amt = Number(amount || 0);
  const held = heldOf((u.transactions || {})[txId]);
  const patch = {
    ['USERS/' + uid + '/pending/withdrawTotal']: Math.max(0, Number(u.pending?.withdrawTotal || 0) - amt),
    ['USERS/' + uid + '/transactions/' + txId + '/status']: 'paid',
    ['USERS/' + uid + '/transactions/' + txId + '/paidAt']: Date.now(),
    ['USERS/' + uid + '/stats/totalWithdraw']: inc(amt),
    ['withdrawRequests/' + uid + '/' + txId + '/status']: 'paid',
    ['withdrawRequests/' + uid + '/' + txId + '/approvedAt']: Date.now(),
  };
  if (!held.total) {
    /* a request made before the money was held up front: take it out now */
    const fromPromo = Math.min(amt, s.promo);
    const promo = s.promo - fromPromo;
    const main = Math.max(0, s.main - (amt - fromPromo));
    patch['USERS/' + uid + '/balance/main'] = main;
    patch['USERS/' + uid + '/balance/promo'] = promo;
    patch['USERS/' + uid + '/balance/total'] = main + promo;
    patch['USERS/' + uid + '/transactions/' + txId + '/held'] = { main: amt - fromPromo, promo: fromPromo };
  }
  await dbPatch(patch);
  cache.usersAt = 0;
  toast(held.total
    ? 'Withdrawal paid · ' + inr(amt) + ' was already held from the balance'
    : 'Withdrawal paid · ' + inr(amt) + ' removed from the balance');
}

async function rejectWithdraw(uid, txId, amount) {
  const u = (await dbGet('USERS/' + uid)) || {};
  const amt = Number(amount || 0);
  const held = heldOf((u.transactions || {})[txId]);
  const patch = {
    ['USERS/' + uid + '/pending/withdrawTotal']: Math.max(0, Number(u.pending?.withdrawTotal || 0) - amt),
    ['withdrawRequests/' + uid + '/' + txId + '/status']: 'rejected',
    ['USERS/' + uid + '/transactions/' + txId + '/status']: 'rejected',
  };
  if (held.total) {
    /* the money was taken out when the request was made — give it back to the
       very buckets it came from, with one atomic increment per bucket */
    patch['USERS/' + uid + '/balance/main'] = inc(held.main);
    patch['USERS/' + uid + '/balance/promo'] = inc(held.promo);
    patch['USERS/' + uid + '/balance/total'] = inc(held.total);
    patch['USERS/' + uid + '/transactions/' + txId + '/refundedAt'] = Date.now();
  }
  await dbPatch(patch);
  cache.usersAt = 0;
  toast(held.total
    ? 'Withdrawal rejected · ' + inr(held.total) + ' returned to the wallet'
    : 'Withdrawal rejected — the amount is free again');
}

                  : '<button class="btn sm primary" onclick="approveWithdraw(\'' + esc(r.uid) + '\',\'' + esc(r.txId) + '\',' + Number(r.amount || 0) + ')">Mark paid</button>' +

}

const txState = { q: '', type: '', status: '' };

async function viewTransactions(view, opts = {}) {
  const users = await loadUsers(!!opts.force);
  const all = userList(users);
  let rows = [];
  all.forEach((u) => Object.entries(u.transactions || {}).forEach(([id, t]) =>
    rows.push({ id, uid: u.uid, name: u.profile?.name || '', ...(t || {}) })));
  rows.sort((a, b) => Number(b.time || 0) - Number(a.time || 0));

  if (txState.type) rows = rows.filter((r) => String(r.type || '') === txState.type);
  if (txState.status) rows = rows.filter((r) => String(r.status || '') === txState.status);
  const q = txState.q.trim().toLowerCase();
  if (q) rows = rows.filter((r) =>
    String(r.uid).includes(q) ||
    String(r.name).toLowerCase().includes(q) ||
    String(r.label || r.source || '').toLowerCase().includes(q));

  const sum = rows.reduce((a, r) => a + Number(r.amount || 0), 0);
  const types = Array.from(new Set(all.flatMap((u) =>
    Object.values(u.transactions || {}).map((t) => String((t || {}).type || ''))))).filter(Boolean);

  view.innerHTML =
    '<div class="card"><div class="row">' +
      '<div class="grow"><input id="tq" placeholder="Search UID, username or note…" value="' +
        esc(txState.q) + '" /></div>' +
      '<select id="ttype" style="max-width:170px"><option value="">All types</option>' +
        types.map((t) => '<option value="' + esc(t) + '">' + esc(t) + '</option>').join('') + '</select>' +
      '<select id="tstatus" style="max-width:170px"><option value="">All statuses</option>' +
        ['pending', 'completed', 'won', 'streak', 'paid', 'rejected'].map((s) =>
          '<option value="' + s + '">' + s + '</option>').join('') + '</select>' +
      '<button class="btn" id="treload">↻ Reload</button>' +
    '</div>' +
    '<div class="sub" style="margin-top:12px">' + num(rows.length) + ' rows · total ' + inr(sum) + '</div></div>' +

    '<div class="card"><div class="table-wrap"><table><thead><tr>' +
      '<th>Time</th><th>UID</th><th>User</th><th>Type</th><th>Details</th>' +
      '<th class="num">Amount</th><th>Status</th><th></th>' +
    '</tr></thead><tbody>' +
    (rows.length ? rows.slice(0, 400).map((r) =>
      '<tr><td class="mono">' + fmtTime(r.time) + '</td>' +
      '<td class="mono clickable" onclick="openUser(\'' + esc(r.uid) + '\')">' + esc(r.uid) + '</td>' +
      '<td>' + esc(r.name || '—') + '</td>' +
      '<td>' + esc(r.type || '—') + '</td>' +
      '<td>' + esc(r.label || r.source || r.method || '—') + '</td>' +
      '<td class="num">' + inr(r.amount) + '</td>' +
      '<td>' + statusBadge(r.status) + '</td>' +
      '<td><button class="btn sm danger" onclick="delTxOf(\'' + esc(r.uid) + '\',\'' + esc(r.id) +
        '\')">✕</button></td></tr>').join('')
      : '<tr><td colspan="8" class="empty">No transactions match</td></tr>') +
    '</tbody></table></div></div>';

  $('#ttype').value = txState.type;
  $('#tstatus').value = txState.status;
  let t = null;
  $('#tq').oninput = (e) => {
    clearTimeout(t);
    t = setTimeout(() => { txState.q = e.target.value; viewTransactions(view); }, 250);

  $('#ttype').onchange = (e) => { txState.type = e.target.value; viewTransactions(view); };
  $('#tstatus').onchange = (e) => { txState.status = e.target.value; viewTransactions(view); };
  $('#treload').onclick = () => { cache.usersAt = 0; viewTransactions(view, { force: true }); };
}

async function viewNotifications(view) {
  const [msgs, notice, legacyNotice] = await Promise.all([
    dbGet('MESSAGES'),
    dbGet('CONFIG/NOTICE'),
    dbGet('CONFIG/notice'),
  ]);
  const list = Object.entries(msgs || {})
    .map(([id, m]) => ({ id, ...(m || {}) }))
    .sort((a, b) => String(b.time || '').localeCompare(String(a.time || '')));

  const stamp = () => {
    const d = new Date(Date.now() + IST_OFFSET_MS);
    const p = (n) => String(n).padStart(2, '0');
    return d.getUTCFullYear() + '-' + p(d.getUTCMonth() + 1) + '-' + p(d.getUTCDate()) +
      ' ' + p(d.getUTCHours()) + ':' + p(d.getUTCMinutes());
  };

  view.innerHTML =
    '<div class="card"><h2>Home notice bar</h2>' +
      '<div class="sub">the scrolling announcement on the home page (CONFIG/NOTICE)</div>' +
      '<textarea id="ntText" placeholder="🎉 Welcome to the platform …">' +
        esc(notice?.text || legacyNotice || '') + '</textarea>' +
      '<div class="row" style="margin-top:12px">' +
        '<button class="btn primary" id="ntSave">Save notice</button>' +
        '<span class="muted">Leave it empty to fall back to the text inside the app.</span>' +
      '</div></div>' +

    '<div class="card"><h2>New notification</h2>' +
      '<div class="sub">shown in the app under Notifications (MESSAGES node)</div>' +
      '<div class="grid2">' +
        field('Title', 'nmTitle', '') +
        field('Time stamp', 'nmTime', stamp()) +
        '<label class="f">Tone<select id="nmTone">' +
          '<option value="gold">gold</option><option value="green">green</option>' +
          '<option value="red">red</option></select></label>' +
      '</div>' +
      '<label class="f" style="margin-top:10px">Message<textarea id="nmDesc" placeholder="Write the notification text…"></textarea></label>' +
      '<div class="row" style="margin-top:12px"><button class="btn primary" id="nmAdd">Send notification</button></div>' +
    '</div>' +

    '<div class="card"><h2>Sent notifications (' + list.length + ')</h2>' +
      '<div class="sub">the app always shows these first, then the built-in welcome messages</div>' +
      '<div class="table-wrap"><table><thead><tr><th>Time</th><th>Title</th><th>Message</th>' +
      '<th>Tone</th><th>Visible</th><th></th></tr></thead><tbody>' +
      (list.length ? list.map((m) =>
        '<tr><td class="mono">' + esc(m.time || '—') + '</td>' +
        '<td>' + esc(m.title || '') + '</td>' +
        '<td>' + esc((m.desc || '').slice(0, 90)) + '</td>' +
        '<td>' + esc(m.tone || 'gold') + '</td>' +
        '<td>' + (m.active === false || Number(m.active) === 0
          ? '<span class="badge r">hidden</span>' : '<span class="badge g">live</span>') + '</td>' +
        '<td><div class="row">' +
          '<button class="btn sm" onclick="toggleMessage(\'' + esc(m.id) + '\',' +
            (m.active === false || Number(m.active) === 0 ? 1 : 0) + ')">' +
            (m.active === false || Number(m.active) === 0 ? 'Show' : 'Hide') + '</button>' +
          '<button class="btn sm danger" onclick="delMessage(\'' + esc(m.id) + '\')">✕</button>' +
        '</div></td></tr>').join('')
        : '<tr><td colspan="6" class="empty">Nothing sent yet</td></tr>') +
      '</tbody></table></div></div>';

  $('#ntSave').onclick = async () => {
    const text = $('#ntText').value.trim();
    /* the new key and the plain-text key of the older admin schema are kept in
       sync, so nothing that reads either one disagrees */
    await dbPatch({
      'CONFIG/NOTICE': { text, updatedAt: Date.now() },
      'CONFIG/notice': text,
      'CONFIG/updatedAt': Date.now(),
    });
    toast('Notice bar updated');
  };
  const send = async () => {
    const title = $('#nmTitle').value.trim();

function wireWheel() {
  const readSegs = () => $$('#wsTable tbody tr').map((tr, i) => {
    const val = (name) => tr.querySelector('[data-seg="' + name + '"]');
    return {
      index: i,
      label: val('label').value,
      amount: Number(val('amount').value || 0),
      weight: Math.max(0, Number(val('weight').value || 0)),
      ...(val('bonus').value ? { bonus: val('bonus').value } : {}),
    };
  });
  const paintPct = () => {
    const list = readSegs();
    const total = list.reduce((a, s) => a + s.weight, 0) || 1;
    list.forEach((s, i) => {
      const cell = $('[data-pct="' + i + '"]');
      if (cell) cell.textContent = ((s.weight / total) * 100).toFixed(1) + '%';
    });
  };
  const save = async (list, extra) => {
    await dbPut('CONFIG/SPIN', {
      enabled: Number($('#wsEnabled').value),
      dailyLimit: Math.max(1, Number($('#wsLimit').value || 1)),
      resetHour: Number($('#wsHour').value || 4),
      timezone: 'Asia/Kolkata',
      segments: list,
      ...(extra || {}),
    });
  };
  paintPct();
  $('#wsTable').oninput = paintPct;
  $('#wsAdd').onclick = async () => {
    const list = readSegs();
    list.push({ index: list.length, label: 'NEW', amount: 0, weight: 1 });
    await save(list);
    toast('Segment added — check the wheel face index order');
    go('wheel');
  };
  $$('#wsTable [data-delseg]').forEach((btn) => {
    btn.onclick = async () => {
      const i = Number(btn.dataset.delseg);
      const list = readSegs().filter((_, idx) => idx !== i).map((s, idx) => ({ ...s, index: idx }));
      await save(list);
      toast('Segment removed');
      go('wheel');
    };
  });
  $('#wsSave').onclick = async () => {
    await save(readSegs());
    toast('Wheel saved — live within a minute');
  };
}

/* PAYMENT_ORDERS/<order_id> is written by the Worker the moment a QR is created,
   and updated automatically when the bank confirms (webhook or the browser poll
   — both settle through the same idempotent code, so an order can never be
   credited twice). The merchant API key is a Worker secret and is never stored
   here, so this screen shows the setup values instead of the key itself. */
async function viewPayments(view) {
  const [ordersNode, cfgRaw, users, gwLive] = await Promise.all([
    dbGet('PAYMENT_ORDERS'),
    dbGet('CONFIG/PAYMENTS'),
    loadUsers(),
    appPayments(),
  ]);
  const cfg = { enabled: 1, autoCredit: 1, ...(cfgRaw || {}) };
  const orders = Object.values(ordersNode || {})
    .map((o) => o || {})
    .sort((a, b) => Number(b.createdAt || 0) - Number(a.createdAt || 0));

  const by = (s) => orders.filter((o) => String(o.status || '') === s);
  const done = by('success');
  const pending = by('pending');
  const expired = by('expired');
  const dup = by('duplicate');
  const collected = done.reduce((sum, o) => sum + Number(o.creditedAmount || 0), 0);

  const nameOf = (uid) => {
    const u = users[uid] || {};
    return (u.profile && u.profile.name) || 'user' + String(uid || '').replace(/\D/g, '').slice(-4);
  };

  const row = (o) => {
    const id = esc(o.orderId || '');
    return (
      '<tr>' +
      '<td class="mono">' + id + '<div class="muted" style="font-size:11px">' +
        esc(nameOf(o.uid)) + ' · ' + esc(o.uid || '') + '</div></td>' +
      '<td>' + inr(o.payable || o.amount) + '</td>' +
      '<td>' + statusBadge(o.status) +
        (o.credited ? ' <span class="badge g">credited</span>' : '') +
        (o.credited === false && String(o.status) === 'success'
          ? ' <span class="badge y">manual</span>' : '') +
      '</td>' +
      '<td class="mono">' + (o.utr ? esc(o.utr) : '<span class="muted">—</span>') + '</td>' +
      '<td>' + esc(ago(o.createdAt)) + '<div class="muted" style="font-size:11px">' +
        esc(fmtTime(o.createdAt)) + '</div></td>' +
      '<td><div class="row">' +
        '<button class="btn sm" onclick="openPayment(\'' + id + '\')">Details</button>' +
        (String(o.status) === 'pending'
          ? '<button class="btn sm danger" onclick="killPayment(\'' + id + '\')">Close</button>'
          : '') +
      '</div></td></tr>'
    );
  };

  view.innerHTML =
    '<div class="kpis">' +
      kpi('Gateway key', gwLive ? (gwLive.configured ? 'LIVE' : 'MISSING') : 'unknown',
        gwLive
          ? (gwLive.configured ? 'QR + auto-verify works on the phone'
              : 'set FAMGATEWAY_API_KEY on the Worker')
          : 'app not reachable from this browser',
        gwLive ? (gwLive.configured ? 'green' : 'red') : '') +
      kpi('Collected (credited)', inr(collected), done.length + ' successful orders', 'green') +
      kpi('Waiting for payment', String(pending.length), 'QR stays live for 5 minutes',
        pending.length ? 'gold' : '') +
      kpi('Expired / unpaid', String(expired.length), 'nobody paid in time') +
      kpi('Replays blocked', String(dup.length), 'bank reference already used',
        dup.length ? 'red' : '') +
    '</div>' +

    '<div class="card"><h2>Gateway settings</h2>' +
      '<div class="sub">Deposits go through FamGateway (famgateway.in) — UPI QR with instant ' +
      'bank confirmation. The app reads CONFIG/PAYMENTS live, so these switches bite in seconds.</div>' +
      '<div class="grid2">' +
        field('Deposits enabled (1 = on, 0 = maintenance)', 'payOn',
          Number(cfg.enabled) === 0 ? 0 : 1, 'number') +
        field('Auto-credit wallet (1 = instant, 0 = approve here)', 'payAuto',
          Number(cfg.autoCredit) === 0 ? 0 : 1, 'number') +
      '</div>' +
      '<div class="row" style="margin-top:14px">' +
        '<button class="btn primary" id="paySave">Save gateway settings</button>' +
        '<button class="btn" id="payReload">Refresh</button>' +
      '</div>' +
      '<div style="margin-top:16px">' +
        line('Merchant API key (Worker secret)', '<b class="mono">FAMGATEWAY_API_KEY</b>') +
        line('Set / rotate it', '<b class="mono">npx wrangler secret put FAMGATEWAY_API_KEY --name www</b>') +
        line('One-click helper (PC)', '<b class="mono">set-gateway-key.bat</b>') +
        line('Live key status', '<b class="mono">' + esc(APP_URL) + '/api/config/rewards</b>') +
        line('Webhook URL (FamGateway → Webhooks)', '<b class="mono">/api/payment/webhook</b>') +
        line('Signature', '<b class="mono">X-FamGateway-Signature · HMAC-SHA256</b>') +
        line('Order window', '<b class="mono">300 seconds</b>') +

      '</tr></thead><tbody>' +
      (orders.length

    ['PAYMENT_ORDERS/' + orderId + '/status']: 'expired',
    ['PAYMENT_ORDERS/' + orderId + '/closedByAdmin']: true,
    ['USERS/' + o.uid + '/transactions/' + o.txId + '/status']: 'expired',
    ['depositRequests/' + o.uid + '/' + o.txId + '/status']: 'expired',

  toast('Order closed');

    const path = ($('#rwPath').value || '').trim();
    if (!path || !confirm('Delete ' + path + ' ?')) return;
    await dbDelete(path);
    cache.usersAt = 0;
    toast('Deleted ' + path);
  };
  $('#sdSpin').onclick = async () => { await dbPut('CONFIG/SPIN', DEFAULT_SPIN); toast('Wheel config seeded'); };
  $('#sdDaily').onclick = async () => { await dbPut('CONFIG/DAILY', DEFAULT_DAILY); toast('Daily config seeded'); };
  $('#sdLimits').onclick = async () => {
    await dbPatch({
      'CONFIG/LIMITS': DEFAULT_LIMITS,
      'CONFIG/minWithdraw': DEFAULT_LIMITS.withdrawMin,
      'CONFIG/maxWithdraw': DEFAULT_LIMITS.withdrawMax,
      'CONFIG/minDeposit': DEFAULT_LIMITS.depositMin,
      'CONFIG/updatedAt': Date.now(),
    });
    toast('Limits seeded');
  };
  $('#bkAll').onclick = async () => {
    toast('Building backup…');
    download('99infinity-backup-' + stamp() + '.json', await dbGet(''));
  };
  $('#bkUsers').onclick = async () => download('99infinity-users-' + stamp() + '.json', await dbGet('USERS'));
  void info;
}

/* -------------------------------------------------------------- 11. boot --- */
function openPanel() {
  $('#gate').classList.add('hide');
  $('#app').classList.add('on');
  $('#sideDb').textContent = DB_URL.replace(/^https?:\/\//, '').replace(/\.firebaseio\.com$/, '');
  buildNav();
  go('dashboard');
}

async function startPanel() {
  try {
    await dbGet('_dbcheck');
    $('#dbDot').classList.remove('bad');
    $('#dbState').textContent = 'connected';
  } catch {
    $('#dbDot').classList.add('bad');
    $('#dbState').textContent = 'unreachable';
    toast('Cannot reach the database — check the URL', true);
  }
  openPanel();
}

$('#gateBtn').onclick = async () => {
  const pass = $('#gatePass').value;
  const url = ($('#gateDb').value || '').trim() || DEFAULT_DB;
  if (pass !== ADMIN_PASSWORD) {
    $('#gateErr').textContent = 'Wrong password.';
    return;
  }
  DB_URL = url.replace(/\/+$/, '');
  LS.set('vgAdminDb', DB_URL);
  LS.set('vgAdminOk', '1');
  sessionStorage.setItem('vgAdminOk', '1');
  startPanel();
};
$('#gateDb').value = DB_URL;
if (sessionStorage.getItem('vgAdminOk') === '1') {
  startPanel();
} else if (LS.get('vgAdminOk', '') === '1') {
  /* a previous visit on this device: keep the URL, still ask for the password */
  LS.del('vgAdminOk');
}
$('#gatePass').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('#gateBtn').click(); });

$('#reloadBtn').onclick = () => { cache.usersAt = 0; go(current, { force: true }); };
$('#logoutBtn').onclick = () => {
  sessionStorage.removeItem('vgAdminOk');
  location.reload();
};
</script>
</body>
</html>
